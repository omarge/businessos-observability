global:
  resolve_timeout: 5m
  # Set via environment or secret in production
  # slack_api_url: 'https://hooks.slack.com/services/T000/B000/XXX'

route:
  group_by: ['alertname', 'severity', 'tenant', 'engine', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
      group_wait: 10s
    - match:
        severity: high
      receiver: 'high'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'
    - match_re:
        alertname: 'Security.*|Compliance.*|Tenant.*'
      receiver: 'security-compliance'
      continue: true

receivers:
  - name: 'default'
    # webhook_configs:
    #   - url: 'http://your-webhook'

  - name: 'critical'
    # Uncomment and fill in production values (use secrets)
