    #     smarthost: 'smtp.yourcompany.com:587'
    #     auth_username: '${SMTP_USER}'
    #     auth_password: '${SMTP_PASSWORD}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'tenant']
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'high'
    equal: ['alertname', 'tenant']
