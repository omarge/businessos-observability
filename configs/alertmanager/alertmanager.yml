route:
  group_by: ['alertname', 'severity', 'engine']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: high
      receiver: 'high'

receivers:
  - name: 'default'
    # webhook_configs:
    #   - url: 'http://your-webhook'

  - name: 'critical'
    # Configure Slack / PagerDuty / email here

  - name: 'high'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
