global:
  resolve_timeout: 5m
  # slack_api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'   # or use slack_configs below

route:
  group_by: ['alertname', 'severity', 'tenant', 'engine', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
      group_wait: 10s
    - match:
        severity: high
      receiver: 'high'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'
    - match_re:
        alertname: 'Security.*|Compliance.*|Tenant.*'
      receiver: 'security-compliance'
      continue: true

receivers:
  - name: 'default'
    # webhook_configs:
    #   - url: 'http://your-webhook'

  - name: 'critical'
    # PagerDuty example (uncomment and set routing_key)
    # pagerduty_configs:
