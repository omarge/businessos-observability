groups:
  - name: businessos-money-critical
    rules:
      - alert: LivenessLoss
        expr: businessos_liveness == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Liveness lost"
          description: "Process and financial authority not both healthy. Do not restart blindly."

      - alert: PostgresDown
        expr: businessos_health_probe{probe="PostgresHealthProbe"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL (financial authority) down"
          description: "System of record for money movement is unreachable."

      - alert: KafkaDown
        expr: businessos_health_probe{probe="KafkaHealthProbe"} == 0
        for: 1m
        labels:
          severity: high
        annotations:
          summary: "Kafka transport down"
          description: "Ingestion/readiness impacted."

      - alert: ReconciliationLag
        expr: businessos_integration_reconciliation_report_pending > 0 or increase(businessos_integration_reconciliation_break_detected_total[5m]) > 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Reconciliation lag or break detected"
          description: "Divergence risk. Check reconciliation engine."

      - alert: UnknownMoneyState
        expr: businessos_health_probe == 0
        for: 2m
        labels:
          severity: medium
        annotations:
          summary: "Unknown probe state"
          description: "Fail-closed; treat as not-ready."

  - name: businessos-reliability
    rules:
      - alert: OutboxPendingHigh
        expr: rate(businessos_integration_outbox_pending_total[5m]) > 10 or businessos_integration_outbox_pending_total > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High outbox pending"
          description: "Messages stuck in outbox. Check relay."

      - alert: SecurityDenialsSpike
        expr: rate(businessos_integration_security_denied_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Security denials spiking"
          description: "Check producer/consumer authorization or tenant mismatch."

  - name: businessos-security-compliance
    rules:
      - alert: SecurityDenialRateHigh
        expr: |
          (
            sum by (tenant, job) (rate(businessos_integration_security_denied_total[5m]))
            /
            clamp_min(
              sum by (tenant, job) (rate(businessos_integration_security_allowed_total[5m])) +
              sum by (tenant, job) (rate(businessos_integration_security_denied_total[5m])),
              0.001
            )
          ) > 0.1
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "High security denial rate for tenant {{ $labels.tenant }}"
          description: "Denial rate > 10%. Possible misconfiguration, attack, or tenant isolation issue."

      - alert: TenantIsolationViolationSuspected
        expr: increase(businessos_integration_security_denied_total{reason=~".*tenant.*|.*isolation.*|.*mismatch.*"}[10m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Possible tenant isolation violation"
          description: "Elevated denials related to tenant mismatch or isolation. Immediate review required."

      - alert: QuarantineSpike
        expr: rate(businessos_integration_quarantine_total[5m]) > 1
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Quarantine events spiking"
          description: "Messages being quarantined. Check security policy and payload validity."

      - alert: ComplianceAuditFailure
        expr: increase(businessos_integration_security_denied_total{reason=~".*audit.*|.*compliance.*"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Compliance / audit related denial"
          description: "Review audit trail and policy decisions."

  - name: businessos-slo-errors-latency
    rules:
      - alert: PaymentErrorRatioHigh
        expr: businessos:payment_error_ratio:rate5m > 0.01
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Payment error ratio above 1%"
          description: "Payment failed / (authorized + failed) exceeded 1% for 5 minutes."

      - alert: FraudDeclineRatioHigh
        expr: businessos:fraud_decline_ratio:rate5m > 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Fraud decline ratio above 15%"
          description: "Fraud decline rate is elevated. Review policy or traffic."

      - alert: LatencySLOBreach
        expr: businessos:payment_latency:p95 > 0.5 or businessos:fraud_latency:p95 > 0.8 or businessos:settlement_latency:p95 > 1
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Domain latency SLO breach"
          description: "One or more domain p95 latencies exceeded target (payment >500ms, fraud >800ms, settlement >1s)."

      - alert: HttpErrorRatioHigh
        expr: businessos:http_error_ratio:rate5m > 0.05
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "HTTP 5xx ratio above 5% on {{ $labels.job }}"
          description: "Platform error rate is elevated."

      - alert: DomainLatencySpike
        expr: |
          businessos:payment_latency:p95 > 3 * avg_over_time(businessos:payment_latency:p95[1h])
          or
          businessos:fraud_latency:p95 > 3 * avg_over_time(businessos:fraud_latency:p95[1h])
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Domain latency spike (3x 1h baseline)"
          description: "p95 latency is more than 3 times the recent baseline."

  - name: businessos-liquidity
    rules:
      - alert: LiquidityReservationFailureHigh
        expr: rate(businessos_treasury_liquidity_reservation_failed_total[5m]) > 0.1
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "High liquidity reservation failure rate"
          description: "Reservation failures exceeded threshold. Check LiquidityReservationService."

      - alert: LiquidityFundingFailed
        expr: rate(businessos_treasury_liquidity_funding_failed_total[5m]) > 0
        for: 2m
        labels:
          severity: high
        annotations:
          summary: "Liquidity funding failures detected"
          description: "Funding executions are failing. Review FundingService and liquidity position."

      - alert: LiquidityInsufficientSpike
        expr: rate(businessos_treasury_liquidity_insufficient_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Liquidity insufficient events spiking"
          description: "Frequent insufficient liquidity. Review cash position and funding plans."

      - alert: LiquidityReservationLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(businessos_treasury_liquidity_reservation_latency_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Liquidity reservation p95 latency above 1s"
          description: "Reservation path is slow."
