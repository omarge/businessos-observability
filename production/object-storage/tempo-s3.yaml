# Tempo production config with S3 object storage

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 720h   # 30 days

storage:
  trace:
    backend: s3
    s3:
      bucket: businessos-tempo
      endpoint: s3.amazonaws.com
      region: us-east-1
      # access_key / secret_key via env or IAM
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:8080/api/v1/push
